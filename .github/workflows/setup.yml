name: Setup checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  setup:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python tests
        run: python -B -m unittest discover -s tests -p 'test_*.py' -v
      - name: Unix wrapper tests
        if: runner.os != 'Windows'
        run: sh tests/test_copilot_shell_defaults.sh
      - name: PowerShell wrapper tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/test_copilot_shell_defaults.ps1
      - name: Windows entry point smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./link.ps1 -Profile work -DryRun
