# Prefix stays C-b: default muscle memory works unmodified on any remote box
set -g mouse on                      # click/scroll while learning; keys remain primary
set -g base-index 1                  # windows number from 1, matching the keyboard row
setw -g mode-keys vi                 # vi keys in copy/scroll mode
set -g escape-time 0                 # no Esc delay (vim mode switches feel instant)
set -g history-limit 50000
set -g default-terminal "tmux-256color"
# RGB: true colour under Ghostty. hyperlinks: forward OSC 8 links (Claude Code
# emits them; xterm-ghostty terminfo lacks Hls). extkeys: pass Kitty-protocol
# modified keys (Shift-Enter / Ctrl-Enter) through to Claude Code and nvim.
set -as terminal-features "xterm-ghostty:RGB:hyperlinks:extkeys"
set -s extended-keys on
# Set the terminal window title; without this Ghostty falls back to its
# default "👻 Ghostty" titlebar. A single space renders as a blank title
# (a truly empty string would trigger the fallback again).
set -g set-titles on
set -g set-titles-string " "

# ── Catppuccin Mocha, to match Ghostty's theme ──────────────────────────────
# Palette: Base #1e1e2e  Surface0 #313244  Surface1 #45475a  Overlay1 #7f849c
#          Text #cdd6f4  Mauve #cba6f7  Red #f38ba8  Yellow #f9e2af
# Replaces tmux's default green/yellow accents on every color surface it exposes.

# status bar
set -g status-style "bg=#313244,fg=#cdd6f4"          # Surface0 bar, Text
set -g window-status-style "fg=#7f849c"              # Overlay1: idle windows recede
set -g window-status-current-style "fg=#cba6f7,bold" # Mauve: current window
set -g window-status-activity-style "fg=#f9e2af"     # Yellow: activity flag
set -g window-status-bell-style "fg=#f38ba8,bold"    # Red: bell

# Show local window names and a clock without running background scripts.
set -g window-status-format "#I:#W#F"
set -g window-status-current-format "#I:#W#F"
set -g status-interval 5
set -g status-right "#[fg=#7f849c]#{host_short} %H:%M "
bind C-j choose-tree -Zw
bind -n M-j choose-tree -Zw

# pane borders (only visible with 2+ panes)
set -g pane-border-style "fg=#45475a"                # Surface1: idle
set -g pane-active-border-style "fg=#cba6f7"         # Mauve: focused pane

# prompt / message line (rename-window, command prompt, status messages)
set -g message-style "bg=#45475a,fg=#cdd6f4"
set -g message-command-style "bg=#45475a,fg=#cdd6f4"

# copy-mode selection & choose-tree/menu selector (was the yellow highlight)
set -g mode-style "bg=#45475a,fg=#cdd6f4"

# clock (prefix t)
set -g clock-mode-colour "#cba6f7"                   # Mauve

set -g pane-base-index 1             # panes number from 1 too, matching windows
set -g renumber-windows on           # close a window and the rest renumber, no gaps
set -g focus-events on               # nvim sees focus lost/gained (autoread, autosave-on-blur)
# Forward copy-mode selections and pane OSC 52 to the attached terminal.
set -g set-clipboard on

# vim-style pane navigation, so hands stay on the home row (prefix-first still works)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
# prefix l now selects the right pane (above), so re-home tmux's default
# last-window toggle onto prefix Tab.
bind Tab last-window

# Open new splits/windows in the SAME directory as the current pane (the single
# most common tmux quality-of-life setting). Keep the standard split keys.
bind '%' split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind c   new-window      -c "#{pane_current_path}"

# Seamless nvim <-> tmux navigation: bare C-hjkl moves across BOTH nvim splits
# and tmux panes (pairs with vim-tmux-navigator in the nvim config). If the
# current pane runs vim, the key is forwarded so nvim handles it; at nvim's
# edge the plugin hands back to tmux.
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
# bare C-l no longer clears the shell; prefix C-l does it instead
bind C-l send-keys 'C-l'

# vim-style selection in copy-mode: v begins, C-v toggles block, y yanks. These
# add to the standard Space/Enter bindings.
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi 'C-v' send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# prefix ? — task-oriented menu of this config's keys (replaces the raw
# list-keys dump); each entry runs on its letter.
set -g @dotfiles-window-switch-command "choose-tree -Zw"
set -g @dotfiles-waiting-command ""
bind ? display-menu -T "#[align=centre]tmux" \
  "switch window (M-j)"   s "#{@dotfiles-window-switch-command}" \
  "last window"          Tab "last-window" \
  "#{?@dotfiles-waiting-command,waiting agent,}" g "#{@dotfiles-waiting-command}" \
  "new window (here)"      c "new-window -c '#{pane_current_path}'" \
  "split right"            % "split-window -h -c '#{pane_current_path}'" \
  "zoom pane"              z "resize-pane -Z" \
  "copy / scroll mode"    '[' "copy-mode" \
  "detach"                 d "detach-client"

# reload this file without restarting tmux
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"
